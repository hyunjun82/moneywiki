# 금시세 일일 기사 — 예비 발행 (2026-09-20 부터)
#
# 본 발행은 PC 수집기(scripts/gold/collect-kgx.ps1 → Publish-News)가 평일 10:00 고시 직후 main 에 커밋한다.
# GitHub 의 schedule 은 이 저장소에서 4시간 넘게 늦게 뜬다(2026-09-15~18 실측: 10:15 예약이 14:53 실행).
# 그래서 예약을 3개(10:15·10:45·11:15) 두던 것을 1개로 줄이고, 이 워크플로는 PC 가 발행하지 못한 날의 예비로만 둔다.
# 생성기는 오늘 기사가 이미 있으면 아무것도 하지 않고, 고시일이 오늘이 아니면 exit 3 으로 끝낸다(--require-today).
# 11시(KST) 이후에도 오늘 기사가 없고 당일 고시도 없으면 잡을 실패시켜 알림이 가게 한다 — 하루 최대 1통.
# 커밋이 올라가면 Cloudflare Pages 가 재빌드하면서 /gold/news/YYYY-MM-DD 가 생기고,
# 기존 IndexNow 워크플로 + 아래의 직접 핑으로 검색엔진에 즉시 알린다.

name: Gold News Publish

on:
  schedule:
    - cron: "20 1 * * 1-5" # UTC 01:20 = KST 10:20 (평일) — 예비. 실제로는 몇 시간 늦게 뜬다
  workflow_dispatch:
    inputs:
      ignore_date:
        description: "고시일이 오늘이 아니어도 발행 (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: gold-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate today's article
        id: gen
        run: |
          set +e
          if [ "${{ github.event.inputs.ignore_date }}" = "true" ]; then
            node scripts/gold/generate-news.mjs
          else
            node scripts/gold/generate-news.mjs --require-today
          fi
          CODE=$?
          set -e
          if [ "$CODE" = "3" ]; then
            HOUR=$(TZ=Asia/Seoul date +%H)
            TODAY=$(TZ=Asia/Seoul date +%F)
            if [ "$HOUR" -ge 11 ] && [ ! -f "src/data/gold-news/${TODAY}.json" ]; then
              echo "::error::${TODAY} 기사가 없고 당일 고시도 없습니다. PC 수집기(collect-kgx.ps1, %LOCALAPPDATA%/moneywiki/collect-kgx.log)를 확인하세요."
              exit 1
            fi
            echo "당일 고시 대기 — 발행하지 않음"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $CODE

      - name: Commit & push to main
        id: push
        if: steps.gen.outputs.skipped != 'true'
        run: |
          git config user.name "gold-news-bot"
          git config user.email "actions@github.com"
          git add src/data/gold-news
          if git diff --cached --quiet; then
            echo "변경 없음 — 오늘 기사가 이미 있음"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(TZ=Asia/Seoul date +%F)
          git commit -m "feat: 금시세 뉴스 ${TODAY} 자동 발행/정정"
          git pull --rebase origin main
          git push origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: IndexNow ping
        if: steps.push.outputs.pushed == 'true'
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "www.jjyu.co.kr",
              "key": "cf14d2ece5b0438e848760be86604782",
              "keyLocation": "https://www.jjyu.co.kr/cf14d2ece5b0438e848760be86604782.txt",
              "urlList": [
                "https://www.jjyu.co.kr/gold/news/'"${TODAY}"'",
                "https://www.jjyu.co.kr/gold/news",
                "https://www.jjyu.co.kr/gold"
              ]
            }' || true
