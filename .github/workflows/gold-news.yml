# 금시세 일일 기사 자동 발행
#
# 평일 10:15 KST 에 src/data/gold-news/YYYY-MM-DD.json 을 생성해 main 에 커밋한다.
# 국내 고시(한국금거래소 1차)는 09:50~10:10 에 나오므로 그 뒤에 돌아야 전일 숫자가 오늘 기사에
# 섞이지 않는다 (예전 05:30/09:20 발행은 전일 고시로 기사를 썼다 — 2026-09-09 실측).
# 생성기는 price.json 의 고시일이 오늘이 아니면 발행하지 않고 exit 3 으로 끝낸다(--require-today).
# 10:45·11:15 에 다시 시도하고, 11시 이후에도 당일 고시가 없으면 잡을 실패시켜 GitHub 알림이 가게 한다.
# 커밋이 올라가면 Cloudflare Pages 가 재빌드하면서 /gold/news/YYYY-MM-DD 가 생기고,
# 기존 IndexNow 워크플로 + 아래의 직접 핑으로 검색엔진에 즉시 알린다.

name: Gold News Publish

on:
  schedule:
    - cron: "15 1 * * 1-5" # UTC 01:15 = KST 10:15 (평일) — 본 발행
    - cron: "45 1 * * 1-5" # UTC 01:45 = KST 10:45 — 재시도 1
    - cron: "15 2 * * 1-5" # UTC 02:15 = KST 11:15 — 재시도 2, 실패 시 알림
  workflow_dispatch:
    inputs:
      ignore_date:
        description: "고시일이 오늘이 아니어도 발행 (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: gold-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate today's article
        id: gen
        run: |
          set +e
          if [ "${{ github.event.inputs.ignore_date }}" = "true" ]; then
            node scripts/gold/generate-news.mjs
          else
            node scripts/gold/generate-news.mjs --require-today
          fi
          CODE=$?
          set -e
          if [ "$CODE" = "3" ]; then
            HOUR=$(TZ=Asia/Seoul date +%H)
            if [ "$HOUR" -ge 11 ]; then
              echo "::error::당일 고시가 11시까지 없어 기사를 발행하지 않았습니다. price-data 갱신기(gold-price.yml)와 고시 소스를 확인하세요."
              exit 1
            fi
            echo "당일 고시 대기 — 다음 예약(10:45 / 11:15)에서 재시도"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $CODE

      - name: Commit & push to main
        id: push
        if: steps.gen.outputs.skipped != 'true'
        run: |
          git config user.name "gold-news-bot"
          git config user.email "actions@github.com"
          git add src/data/gold-news
          if git diff --cached --quiet; then
            echo "변경 없음 — 오늘 기사가 이미 있음"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(TZ=Asia/Seoul date +%F)
          git commit -m "feat: 금시세 뉴스 ${TODAY} 자동 발행/정정"
          git pull --rebase origin main
          git push origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: IndexNow ping
        if: steps.push.outputs.pushed == 'true'
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "www.jjyu.co.kr",
              "key": "cf14d2ece5b0438e848760be86604782",
              "keyLocation": "https://www.jjyu.co.kr/cf14d2ece5b0438e848760be86604782.txt",
              "urlList": [
                "https://www.jjyu.co.kr/gold/news/'"${TODAY}"'",
                "https://www.jjyu.co.kr/gold/news",
                "https://www.jjyu.co.kr/gold"
              ]
            }' || true
