# 환율 갱신기 — fx.json 을 price-data 브랜치에 발행
#
# - 2026-10-01 부터 주 갱신은 PC 수집기(scripts/gold/collect-kgx.ps1)가 하루 3번 한다:
#   09:30 개장 · 11:00 수출입은행 고시 + 환율 기사 · 15:30 주간 마감. 매매기준율은 하루 한 번 정해져
#   30분 갱신은 낼 원화를 거의 바꾸지 않고, 이 저장소의 깃허브 예약은 몇 시간씩 늦게 떴다(10:29 이후 멈춤 실측).
# - 여기는 PC 가 꺼졌을 때의 예비로 하루 2번(10:15·16:15 KST)만 남긴다.
# - 수출입은행 공식 매매기준율은 스크립트가 하루 1회만 호출한다
#   (EXIM_API_KEY 시크릿이 있을 때만. 없으면 시장환율만 발행).
# - 커밋 메시지의 [CI Skip] 덕분에 Cloudflare Pages 빌드는 돌지 않는다.
# - 결과 주소: https://raw.githubusercontent.com/hyunjun82/moneywiki/price-data/fx.json

name: FX Rate Update

on:
  schedule:
    - cron: "15 1,7 * * 1-5" # 10:15 · 16:15 KST (PC 수집기의 예비)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fx-rate
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main (스크립트)
        uses: actions/checkout@v4

      - name: Checkout price-data 브랜치 (이전 데이터)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: price-data
          path: price-data

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run updaters (은행 우대율 → 환율 순, fx.json 하나로 합침)
        env:
          EXIM_API_KEY: ${{ secrets.EXIM_API_KEY }}
        run: |
          mkdir -p price-data
          # 은행 우대율: 하루 1회만 실제 조회하고, 그 외에는 이전 값을 재사용한다
          node scripts/fx/update-banks.mjs price-data/banks.json /tmp/banks.json || echo "은행 수집 실패 — 환율만 갱신"
          cp /tmp/banks.json price-data/banks.json 2>/dev/null || true
          # 환율: banks.json 을 fx.json 의 banks 키로 병합해 발행
          node scripts/fx/update-fx.mjs price-data/fx.json /tmp/fx.json /tmp/banks.json
          cp /tmp/fx.json price-data/fx.json
          cp /tmp/fx-history.json price-data/fx-history.json

      # price-data 에는 금 워크플로(15분)·PC 수집기(30분)도 밀어 넣는다. 같은 순간에 겹치면 push 가
      # 거절된다(2026-09-09 실측). 매번 원격 최신으로 맞춘 뒤 우리 파일만 얹고, 거절되면 최대 3번 다시 시도한다.
      - name: Commit & push to price-data (원격 최신 위에 얹기, 최대 3회)
        run: |
          cd price-data
          git config user.name "fx-rate-bot"
          git config user.email "actions@github.com"
          if [ ! -d .git ]; then
            git init -b price-data
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi
          for i in 1 2 3; do
            git fetch --depth=1 origin price-data && git reset -q --hard origin/price-data
            cp /tmp/fx.json fx.json
            cp /tmp/fx-history.json fx-history.json
            [ -f /tmp/banks.json ] && cp /tmp/banks.json banks.json
            git add fx.json fx-history.json
            [ -f banks.json ] && git add banks.json
            if git diff --cached --quiet; then
              echo "변경 없음 — 커밋 생략"
              exit 0
            fi
            git commit -q -m "[CI Skip] fx rate update $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:price-data; then
              echo "push 완료 (시도 $i)"
              exit 0
            fi
            echo "push 거절 — 다른 갱신기와 겹침, 다시 시도 ($i/3)"
            sleep 5
          done
          echo "::error::price-data push 3회 실패"
          exit 1
