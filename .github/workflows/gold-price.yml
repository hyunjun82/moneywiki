# 금시세 갱신기 — price.json을 price-data 브랜치에 발행
#
# v2: 깃허브 예약(cron) 유실 대비 다중 알람 구조.
#   GitHub Actions의 schedule은 지연·누락이 잦다(부하 시 건너뜀).
#   그래서 한 시간대마다 5분 간격으로 여러 발을 깔고, 실제로 살아난
#   아무 하나가 갱신을 수행한다. 이미 갱신된 직후면 스크립트가 같은 값을
#   써서 커밋 없이 끝나므로(diff 없음) 중복 실행은 비용이 거의 0이다.
#
# - KST 05~18시대, 매시 :05/:20/:35/:50 (시간당 4발)
#   새벽 시간대는 국내 고시가 실제로 몇 시에 바뀌는지 관측하는 목적도 겸한다.
# - 값이 그대로면 커밋이 없으므로 휴장일 실행도 비용이 거의 없다
# - KRX API는 스크립트가 하루 1회만 호출 (공공데이터포털 활용신청 조건)
# - 커밋 메시지의 [CI Skip] 덕분에 Cloudflare Pages 빌드는 돌지 않는다
# - 결과 주소: https://raw.githubusercontent.com/hyunjun82/moneywiki/price-data/price.json

name: Gold Price Update

on:
  schedule:
    # UTC 20~23시 + 00~09시 = KST 05~18시 (매일)
    - cron: "5,20,35,50 20-23,0-9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gold-price
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main (스크립트)
        uses: actions/checkout@v4

      - name: Checkout price-data 브랜치 (이전 데이터)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: price-data
          path: price-data

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run updater
        env:
          DATA_GO_KR_KE: ${{ secrets.DATA_GO_KR_KE }}
        run: |
          mkdir -p price-data
          node scripts/gold/update-price.mjs price-data/price.json /tmp/price.json
          cp /tmp/price.json price-data/price.json

      # price-data 에는 환율 워크플로(30분)·PC 수집기(30분)도 밀어 넣는다. 같은 순간에 겹치면 push 가
      # 거절된다(2026-09-09 실측: "cannot lock ref"). 그래서 매번 원격 최신으로 맞춘 뒤 우리 파일만 얹고,
      # 거절되면 다시 맞춰 최대 3번 시도한다. gold.json 은 그때마다 원격 최신 kgx-quotes.json 으로 다시 만든다.
      #   gold.json — 화면이 읽는 파일 (스펙 5절). 한국금거래소 회차 고시(kgx-quotes.json, PC 가 push)
      #   + 방금 갱신한 price.json(KRX 도매) + Yahoo 기준가. PC 가 꺼져 있어도 기준가·도매는 움직인다.
      #   kgx-quotes.json 이 아직 없으면 gold.json 을 만들지 않는다(실패 아님).
      - name: Commit & push to price-data (원격 최신 위에 얹기, 최대 3회)
        run: |
          cd price-data
          git config user.name "gold-price-bot"
          git config user.email "actions@github.com"
          if [ ! -d .git ]; then
            git init -b price-data
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi
          for i in 1 2 3; do
            git fetch --depth=1 origin price-data && git reset -q --hard origin/price-data
            cp /tmp/price.json price.json
            if [ -f kgx-quotes.json ]; then
              node ../scripts/gold/build-gold-json.mjs . || echo "gold.json 생성 실패 — price.json 만 발행"
            else
              echo "kgx-quotes.json 없음 — gold.json 생략"
            fi
            git add price.json
            [ -f gold.json ] && git add gold.json
            if git diff --cached --quiet; then
              echo "변경 없음 — 커밋 생략"
              exit 0
            fi
            git commit -q -m "[CI Skip] gold price update $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:price-data; then
              echo "push 완료 (시도 $i)"
              exit 0
            fi
            echo "push 거절 — 다른 갱신기와 겹침, 다시 시도 ($i/3)"
            sleep 5
          done
          echo "::error::price-data push 3회 실패"
          exit 1
