# 금시세 갱신기 — price.json을 price-data 브랜치에 발행
#
# - 월~토 09:10~18:10 KST 매시 실행 (일요일 휴장, 종로금거래소도 일요일 휴무)
# - KRX API는 스크립트가 하루 1회만 호출 (공공데이터포털 활용신청 조건)
# - 커밋 메시지의 [CI Skip] 때문에 Cloudflare Pages 빌드는 돌지 않는다
# - 결과 주소: https://raw.githubusercontent.com/hyunjun82/moneywiki/price-data/price.json

name: Gold Price Update

on:
  schedule:
    - cron: "10 0-9 * * 1-6" # UTC 00:10~09:10 = KST 09:10~18:10, 월~토
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gold-price
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main (스크립트)
        uses: actions/checkout@v4

      - name: Checkout price-data 브랜치 (이전 데이터)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: price-data
          path: price-data

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run updater
        env:
          DATA_GO_KR_KE: ${{ secrets.DATA_GO_KR_KE }}
        run: |
          mkdir -p price-data
          node scripts/gold/update-price.mjs price-data/price.json /tmp/price.json
          cp /tmp/price.json price-data/price.json

      - name: Commit & push to price-data
        run: |
          cd price-data
          git config user.name "gold-price-bot"
          git config user.email "actions@github.com"
          if [ ! -d .git ]; then
            git init -b price-data
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi
          git add price.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "[CI Skip] gold price update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:price-data
